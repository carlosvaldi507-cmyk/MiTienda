<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Página no encontrada | Todo Klick</title>

    <meta name="theme-color" content="#071821">
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        margin: 0;
        padding: 24px;
        overflow: hidden;
        color: #f5fbfb;
        background:
          radial-gradient(circle at 18% 18%, rgba(56,216,200,.17), transparent 28rem),
          radial-gradient(circle at 85% 75%, rgba(184,243,107,.1), transparent 25rem),
          #050d13;
        font-family: "Segoe UI", Arial, sans-serif;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        opacity: .22;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
        background-size: 48px 48px;
      }
      main {
        position: relative;
        width: min(760px, 100%);
        padding: clamp(32px, 7vw, 72px);
        border: 1px solid rgba(172,225,226,.16);
        border-radius: 30px;
        background: linear-gradient(145deg, rgba(16,45,57,.94), rgba(7,24,33,.97));
        box-shadow: 0 32px 90px rgba(0,0,0,.42);
      }
      .marca { display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 900; letter-spacing: .08em; }
      .marca span { display: grid; width: 38px; height: 38px; place-items: center; border-radius: 12px; color: #042421; background: linear-gradient(145deg,#38d8c8,#b8f36b); }
      .codigo { margin: 48px 0 6px; color: #58ded1; font-size: clamp(5rem, 19vw, 10rem); font-weight: 950; line-height: .75; letter-spacing: -.09em; }
      h1 { max-width: 560px; margin: 28px 0 13px; font-size: clamp(2rem, 6vw, 4rem); line-height: .96; letter-spacing: -.055em; }
      p { max-width: 520px; margin: 0; color: #a9c2c8; font-size: 17px; line-height: 1.6; }
      .acciones { display: flex; flex-wrap: wrap; gap: 11px; margin-top: 30px; }
      a { display: inline-flex; min-height: 50px; align-items: center; justify-content: center; padding: 0 19px; border: 1px solid rgba(172,225,226,.17); border-radius: 14px; color: #dff7f5; background: rgba(255,255,255,.035); font-weight: 800; text-decoration: none; }
      a:first-child { border: 0; color: #042421; background: linear-gradient(145deg,#38d8c8,#80e7bd); }
      a:hover { transform: translateY(-2px); }
      @media (max-width: 520px) { main { padding: 30px 22px; border-radius: 22px; } .codigo { margin-top: 38px; } .acciones a { width: 100%; } }
    </style>
  </head>
  <body>
    <main>
      <div class="marca"><span>TK</span> TODO KLICK</div>
      <div class="codigo" aria-hidden="true">404</div>
      <h1>Esta ruta se nos escapó del carrito.</h1>
      <p>La página que buscas no existe o cambió de lugar. Tus productos y tu carrito siguen seguros.</p>
      <div class="acciones">
        <a href="index.html">Volver al inicio</a>
        <a href="catalogo.html">Explorar el catálogo</a>
      </div>
    </main>
  </body>
</html>
